name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-security:
    name: Quality & Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Code Formatting Check (Ruff)
        run: uv run ruff format --check src tests bench

      - name: Linting & Code Quality (Ruff)
        run: uv run ruff check src tests bench

      - name: Static Type Checking (Pyright)
        run: uv run pyright

      - name: AST Security Vulnerability Scan (Bandit)
        run: uv run bandit -c pyproject.toml -r src/

      - name: Supply-Chain Dependency Audit (pip-audit)
        run: uv export --no-dev --no-emit-project | uv run pip-audit -r /dev/stdin

      - name: Test Suite & Coverage Gate (Pytest >= 80%)
        run: uv run pytest --cov=contextcull --cov-report=term-missing
