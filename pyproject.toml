[project]
name = "tep"
version = "0.1.0"
description = "Deterministic Token-Efficiency Protocol (TEP) context compiler"
readme = "README.md"
authors = [
    { name = "Mayur Virkar", email = "mayurvirkar@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ahocorasick-rs>=1.0.3",
    "lingua-language-detector>=2.0.2",
    "markdown-it-py>=4.2.0",
    "numpy>=2.5.3",
    "orjson>=3.12.0",
    "pypdf>=6.19.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sparse-dot-topn>=1.2.0",
    "tiktoken>=0.14.0",
    "typer-slim>=0.24.0",
]

[project.scripts]
tep = "tep.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "coverage>=7.16.1",
    "hypothesis>=6.168.0",
    "mutmut>=3.8.0",
    "pip-audit>=2.10.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.8",
]
bench = [
    "nltk>=3.9.1",
    "sumy>=0.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
    "B008",  # Typer argument defaults
    "E501",  # Line length
    "B905",  # zip strict parameter
]

[tool.pyright]
include = ["src", "tests", "bench"]
exclude = [".venv"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
reportMissingTypeStubs = false

[tool.bandit]
exclude_dirs = [".venv", "tests", "bench", "scratch"]
skips = [
    "B105",  # hardcoded_password_string: false positive on "token" dictionary key
    "B110",  # try_except_pass: deliberate fallback in parser detection
    "B112",  # try_except_continue: deliberate resilient loop in PDF page parsing
]

[tool.mutmut]
source_paths = ["src/tep/"]
runner = "python -m pytest -x -q"

[tool.coverage.run]
source = ["src/tep"]
omit = ["src/tep/cli.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
